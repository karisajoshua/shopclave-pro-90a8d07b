name: International quote validation
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/international.ts'
      - 'supabase/functions/get-international-quotes/**'
      - 'docs/international/migrations-draft/**'
      - 'src/test/international.test.ts'
      - 'src/test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/international-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: international_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Regenerate a consistent lockfile in CI, then export it for review and commit.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
      - run: npm ci
      - run: npx vitest run src/test/international.test.ts src/test/international-claim-sql.test.ts
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/get-international-quotes/index.ts
      - name: PostgreSQL quote claim integration
        env:
          PGPASSWORD: testonly
        run: |
          psql -h localhost -U postgres -d international_test -v ON_ERROR_STOP=1 -f src/test/sql/international-fixture.sql
          psql -h localhost -U postgres -d international_test -v ON_ERROR_STOP=1 -f docs/international/migrations-draft/002_atomic_quote_claim.sql
          psql -h localhost -U postgres -d international_test -v ON_ERROR_STOP=1 -f src/test/sql/international-claim-integration.sql
