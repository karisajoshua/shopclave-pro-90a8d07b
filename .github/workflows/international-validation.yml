name: International quote validation
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/international.ts'
      - 'supabase/functions/get-international-quotes/**'
      - 'docs/international/migrations-draft/**'
      - 'src/test/international.test.ts'
      - 'src/test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/international-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Regenerate a consistent lockfile in CI, then export it for review and commit.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
      - run: npm ci
      - run: npx vitest run src/test/international.test.ts
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/get-international-quotes/index.ts
